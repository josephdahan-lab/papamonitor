# Monitor Configuration
# --------------------

# Email alerts (requires msmtp — see setup instructions in README)
EMAIL_ENABLED=true
EMAIL_TO="admin@dahan.fr"
# Cooldown between repeated alerts for the same issue (seconds)
EMAIL_COOLDOWN=900

# Temperature thresholds (Celsius)
TEMP_WARN=70
TEMP_CRIT=80

# Memory threshold (percent used)
MEM_WARN=90

# Disk threshold (percent used)
DISK_WARN=85
DISK_CRIT=95

# CPU load threshold (1-minute average, as multiple of core count)
# e.g. 0.9 means 90% of total capacity on this machine
CPU_LOAD_WARN=0.9

# WiFi signal threshold (dBm, more negative = weaker)
WIFI_WARN=-75

# Router to ping for connectivity watchdog
ROUTER="192.168.1.1"

# Cycle the WiFi interface when the router stops answering. Safe on Pis
# that drop their WiFi periodically; disable on servers / always-on hosts
# where bouncing the link would interrupt downstream services.
WIFI_WATCHDOG_ENABLED=true

# Polling interval (seconds)
INTERVAL=60

# Log file — defaults to the repo directory. Override if you cloned
# to a non-standard location.
LOGFILE="${PAPAMONITOR_DIR:-$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)}/monitor.log"

# State directory (for cooldown tracking, boot classification)
STATEDIR="${PAPAMONITOR_DIR:-$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)}/state"
